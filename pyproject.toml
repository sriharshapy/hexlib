[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hexlib"
version = "0.1.0"
description = "Kernel library and programming model for Qualcomm Hexagon NPUs"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.scripts]
hexlib = "hexlib.cli:main"

[tool.setuptools.packages.find]
include = ["hexlib*"]

[project.optional-dependencies]
# Everything needed to run the offline test suite. numpy is a hard dependency
# already; pytest is the only addition. Deliberately NOT listed: pytest-asyncio
# (no test in this repo is async -- it only appears in local warning output
# because it happens to be installed in one dev environment), and
# `qualcomm_device_cloud_sdk`, which is account-gated and imported lazily inside
# hexlib/device/qdc/job.py so that importing the package never requires it.
#
# CI installs THIS extra. It must stay sufficient on its own: `.github/workflows
# /ci.yml` used to read `pip install -e ".[dev]" || pip install -e . pytest`,
# intending the second half as a safety net, but no `dev` extra existed and pip
# treats a missing extra as a WARNING with exit 0 -- so the `||` could never
# fire and pytest was never installed. The build went red on `No module named
# pytest` rather than falsely green, but the fallback was doing nothing.
dev = ["pytest>=8"]
oracle = ["torch>=2.0", "transformers>=5.10"]

[tool.setuptools.package-data]
"hexlib.tests" = ["data/*.npz"]

[tool.pytest.ini_options]
# NO `testpaths` HERE, ON PURPOSE. Keeping hexlib/device/qdc/test_on_device.py
# out of the offline suite (it runs on the phone, and its flat `import utils`
# breaks collection here) is done by `collect_ignore` in the ROOT conftest.py
# instead. `testpaths` would apply only when no path is given on the command
# line, so `pytest hexlib` or `pytest .` would walk back into it; the conftest
# covers every invocation form. See conftest.py's docstring for the full
# reasoning and hexlib/tests/test_qdc_on_device_is_excluded.py for the test
# that pins both -- adding `testpaths` in place of that mechanism fails
# test_naming_a_path_does_not_reach_the_on_device_test_either.
markers = [
    "sdk: requires the Hexagon SDK (hexagon-clang, hexagon-sim). Not run in CI.",
]
