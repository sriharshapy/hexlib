[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hexlib"
version = "0.1.0"
description = "Kernel library and programming model for Qualcomm Hexagon NPUs"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hexlib = "hexlib.cli:main"

[tool.setuptools.packages.find]
include = ["hexlib*"]

[tool.pytest.ini_options]
markers = [
    "sdk: requires the Hexagon SDK (hexagon-clang++, hexagon-sim). Not run in CI.",
]
