name: ci

on: [push, pull_request]

jobs:
  offline:
    # Only the offline tier runs in CI. The Hexagon SDK is license-restricted and
    # is never vendored or fetched, so build, simulation, and device gates run
    # locally and their result tables are attached to the pull request.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]" || pip install -e . pytest
      - run: python -m pytest -q -m "not sdk"
