name: ci

on: [push, pull_request]

jobs:
  offline:
    # Only the offline tier runs in CI. The Hexagon SDK is license-restricted and
    # is never vendored or fetched, so build, simulation, and device gates run
    # locally and their result tables are attached to the pull request.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No `|| pip install -e . pytest` fallback. That was here to be a safety
      # net and could not be one: pip treats a missing extra as a warning and
      # exits 0, so with no `dev` extra defined the fallback never ran and
      # pytest was never installed. The extra is defined in pyproject.toml now
      # and this install is required to be sufficient by itself.
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q -m "not sdk"

  kernel-contract:
    # CI has no Hexagon SDK, so it cannot re-run the gate. It refuses a PR that
    # claims a pass it did not attach.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Check every kernel directory
        run: |
          python - <<'PY'
          import pathlib, sys
          from hexlib.contract import check_kernel_contract
          dirs = sorted(p for p in pathlib.Path("kernels").glob("*/") if p.is_dir())
          if not dirs:
              # A check that found nothing to check must never report success.
              print("::error::no kernel directories found under kernels/")
              sys.exit(1)
          failed = False
          for d in dirs:
              problems = check_kernel_contract(str(d))
              if problems:
                  failed = True
                  print(f"::error::{d}")
                  for p in problems:
                      print(f"  - {p}")
          print(f"checked {len(dirs)} kernel directories")
          sys.exit(1 if failed else 0)
          PY
